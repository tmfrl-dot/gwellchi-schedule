<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원생 스케줄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF8;--surface:#FFFFFF;--ink:#1E2940;--muted:#6B7280;--line:#E2E5E9;
  --red:#C8333A;--gold:#C9A45C;--hl:#F4EA6A;--hl-ink:#1E2940;
  --s-yellow:#FFE27A;--s-lime:#CCF08C;--s-blue:#A9CBFF;--s-purple:#D6BAFF;--s-pink:#FFB9D8;--s-sky:#A9E7FF;--s-mint:#A6F0D6;--s-peach:#FFD3AC;--s-lavender:#C7C9FF;--s-coral:#FFB6B6;
  --p-pink:#FF3D8F;--p-yellow:#E3A400;--p-sky:#0EA5E9;--p-mint:#00B383;--p-purple:#9B4DFF;--p-orange:#FF7A00;--p-lime:#6FBF1E;--p-coral:#FF4D4D;--p-teal:#00B7CE;--p-blue:#3457FF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14171C;--surface:#1C2027;--ink:#E7E9EE;--muted:#9AA1AC;--line:#2C323B;
  --hl:#8C8431;--hl-ink:#FFFDE8;
  --s-yellow:#F2D06B;--s-lime:#C3E585;--s-blue:#9FC2F7;--s-purple:#CBADF8;--s-pink:#F7ABCE;--s-sky:#9EDDF7;--s-mint:#9FE8CE;--s-peach:#F7C99F;--s-lavender:#BEC1F7;--s-coral:#F7ABAB;
  --p-pink:#FF7FB8;--p-yellow:#FFD24D;--p-sky:#6FC9F5;--p-mint:#3FD9AC;--p-purple:#C398FF;--p-orange:#FFA857;--p-lime:#A5DD5C;--p-coral:#FF8A8A;--p-teal:#4DD8EA;--p-blue:#8199FF;
}}
:root[data-theme="dark"]{
  --paper:#14171C;--surface:#1C2027;--ink:#E7E9EE;--muted:#9AA1AC;--line:#2C323B;
  --hl:#8C8431;--hl-ink:#FFFDE8;
  --s-yellow:#F2D06B;--s-lime:#C3E585;--s-blue:#9FC2F7;--s-purple:#CBADF8;--s-pink:#F7ABCE;--s-sky:#9EDDF7;--s-mint:#9FE8CE;--s-peach:#F7C99F;--s-lavender:#BEC1F7;--s-coral:#F7ABAB;
  --p-pink:#FF7FB8;--p-yellow:#FFD24D;--p-sky:#6FC9F5;--p-mint:#3FD9AC;--p-purple:#C398FF;--p-orange:#FFA857;--p-lime:#A5DD5C;--p-coral:#FF8A8A;--p-teal:#4DD8EA;--p-blue:#8199FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p-blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}

header{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 10px}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
header .sub{color:var(--muted);font-size:13px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  display:flex;gap:4px;padding:6px 0 10px;border-bottom:1px solid var(--line)}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:10px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}

.monthbar{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.monthbar h2{margin:0;font-size:19px;font-weight:700}
.monthbar .arrows{display:flex;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:12px;text-align:center;color:var(--muted);padding:4px 0;font-weight:500}
.dow.sun{color:var(--red)}.dow.sat{color:var(--p-blue)}
.cell{position:relative;min-height:54px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;text-align:left;display:flex;flex-direction:column;align-items:flex-start}
.cell.empty{background:transparent;border-color:transparent}
.cell .d{font-size:13px;font-weight:600;line-height:1.2;padding:1px 4px;border-radius:4px}
.cell.sun .d{color:var(--red)}.cell.sat .d{color:var(--p-blue)}
.cell.today .d{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
.cell.sel .d{background:var(--hl);color:var(--hl-ink)}
.cell .cnt{margin-top:auto;font-size:11px;color:var(--muted)}
.cell .cnt b{color:var(--ink);font-size:13px}

/* student calendar session marks */
.cell.has{border-color:transparent;box-shadow:inset 0 0 0 2px var(--gold)}
.cell.has{background:color-mix(in srgb,var(--gold) 7%,var(--surface))}
.mark{font-size:10.5px;line-height:1.25;color:var(--red);font-weight:500;margin-top:2px}
.mark .n{font-weight:700}
.more{font-size:10px;color:var(--muted)}

/* day timeline */
.dayhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;gap:8px}
.dayhead h3{margin:0;font-size:18px;font-weight:700}
.dayhead h3 span{background:var(--hl);color:var(--hl-ink);padding:0 6px;border-radius:3px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--ink);color:var(--paper)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.tl{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.axis{flex:0 0 46px;position:relative;border-right:1px solid var(--line)}
.axis div{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.lanes{flex:1;overflow-x:auto;position:relative}
.lanes-in{position:relative}
.hr{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.bar{position:absolute;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 20%,transparent);
  border-radius:0 6px 6px 0;padding:4px 5px;text-align:left;overflow:hidden;color:var(--ink)}
.bar.stu{background:var(--c);border-left-color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.bar.stu .nm{color:#1B1F27}
.bar.stu .tm{color:#3C424E}
.chip.solid{color:#1B1F27;border-color:transparent}
.person.s{flex-wrap:wrap}
.person.s .swatches{order:5;width:100%;flex-wrap:wrap;margin-top:4px}
.bar .nm{display:block;font-weight:600;font-size:12.5px;color:var(--c);line-height:1.2;word-break:keep-all}
.bar .tm{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
.emptybox{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

.list{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.row .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.row .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;flex:none;width:92px}
.row .n{font-weight:600;flex:1}
.row .m{color:var(--muted);font-size:12px}

/* student chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.chip[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:10px 2px 0}
.summary{margin-top:12px;font-size:14px;color:var(--muted)}
.summary b{color:var(--ink)}

/* people */
.addline{display:flex;gap:8px;margin:18px 0 12px}
.addline input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=time],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.person{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.person .n{flex:1;font-weight:600}
.swatches{display:flex;gap:4px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;padding:4px;text-decoration:underline}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.42);display:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;
  transform:translateY(105%);transition:transform .22s ease;max-height:88vh;overflow:auto}
.sheet.open{transform:none}
.scrim.open{display:block}
.sheet h4{margin:0 0 14px;font-size:17px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 14px}
.check input{width:18px;height:18px}
.actions{display:flex;gap:8px;margin-top:6px}
.actions .btn{flex:1;padding:12px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
@media (min-width:560px){.cell{min-height:70px}.mark{font-size:12px}}
.sec{margin:22px 0 8px;font-size:16px;font-weight:700}
.person select{width:auto;max-width:130px;padding:6px 8px;font-size:14px}
.person .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.legend .chip{padding:4px 10px;font-size:13px}
.tag{font-size:11px;color:var(--c);font-weight:500}
.person.t{flex-wrap:wrap}
.person.t .swatches{order:5;width:100%;flex-wrap:wrap;margin-top:4px}
.seg{display:flex;gap:4px;margin:12px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.planbtn{width:100%;margin-top:12px}
.goal{margin:14px 0 8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--hl);border-radius:8px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.goal p{margin:0;font-weight:600;white-space:pre-wrap}
.goal p.none{color:var(--muted);font-weight:400}
.logwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.log{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
table.log th{background:var(--paper);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.log td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.log tr{cursor:pointer}
table.log tr:last-child td{border-bottom:0}
table.log td.dt{white-space:nowrap;font-weight:600}
table.log td.tm{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
table.log td.c{text-align:center}
table.log .todo{color:var(--muted);font-style:normal;text-decoration:underline}
.stamp{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--red);color:var(--red);font-size:12px;font-weight:700}
.sign{color:var(--c);font-weight:600;white-space:nowrap}
.check-ic{font-size:10px;margin-left:2px}
.logbox{background:var(--paper);border-radius:12px;padding:12px;margin-bottom:14px}
.logbox h5,.schedh{margin:0 0 10px;font-size:14px;font-weight:700}
textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:inherit;color:inherit;resize:vertical;min-height:60px}
.planrow{display:grid;grid-template-columns:64px 1fr 1fr 32px;gap:6px;margin-bottom:6px;align-items:center}
.planrow select,.planrow input{padding:8px 6px;font-size:14px}
.planrow .tsel{grid-column:1 / 4}
.planrow .x{border:0;background:none;color:var(--muted);font-size:18px;grid-row:1 / 3;grid-column:4}
.planitem{border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:8px}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 12px;line-height:1.5}
.mark.abs{text-decoration:line-through;opacity:.5}
.badge{display:inline-block;font-size:10px;line-height:1.3;border:1px solid currentColor;border-radius:4px;padding:0 3px;margin-left:3px;font-weight:600;vertical-align:1px}
.row.abs{opacity:.6}.row.abs .n{text-decoration:line-through}
tr.abs td{color:var(--muted)}
.statusbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.statusbar .btn{flex:1;padding:11px}
.absbox{background:var(--paper);border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px}
.absbox b{color:var(--red)}
header .sub.bad{color:var(--red);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>원생 스케줄</h1>
    <span style="display:flex;align-items:center;gap:8px"><span class="sub" id="sub"></span>
    <button class="iconbtn" id="themeBtn" aria-label="밝게/어둡게 전환">☀️</button></span>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="day">하루 보기</button>
    <button role="tab" data-view="student">원생별 달력</button>
    <button role="tab" data-view="people">원생 관리</button>
  </nav>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== 저장소 (지금은 이 기기에 저장 · 다음 단계에서 구글 시트로 교체) ===== */
const KEY='academy-schedule-v1';
const PENS=['pink','yellow','sky','mint','purple','orange','lime','coral','teal','blue'];
const SPENS=['yellow','lime','blue','purple','pink','sky','mint','peach','lavender','coral'];
const SPEN_KO={yellow:'노랑',lime:'연두',blue:'파랑',purple:'보라',pink:'핑크',sky:'하늘',mint:'민트',peach:'살구',lavender:'라벤더',coral:'코랄'};
const OLD_PEN={red:'coral',green:'mint',ink:'sky',brown:'coral',mustard:'yellow'};
const PEN_KO={pink:'핑크',yellow:'노랑',sky:'하늘',mint:'민트',purple:'보라',orange:'주황',lime:'라임',coral:'코랄',teal:'청록',blue:'파랑'};
const CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const DOW='일월화수목금토';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const uid=()=>Math.random().toString(36).slice(2,10);
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const penVar=c=>{const k=PENS.includes(c)?c:OLD_PEN[c];return k?`var(--p-${k})`:'var(--muted)'};
const hasLog=x=>!!(x.log&&(x.log.content||x.log.homework));
const isAbs=x=>x.status==='absent';
const keep=x=>hasLog(x)||isAbs(x)||!x.fromPlan;
const md=d=>{const[,m,dd]=d.split('-').map(Number);return `${m}/${dd}`};
const hrs=x=>{const h=(toMin(x.end)-toMin(x.start))/60;return Number.isInteger(h)?h:h.toFixed(1)};

function seed(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),ym=`${y}-${pad(m+1)}`;
  const teachers=[{id:uid(),name:'원장님',color:'pink'},{id:uid(),name:'김 선생님',color:'sky'},{id:uid(),name:'이 선생님',color:'lime'}];
  const names=[['민서',0,'HSK 4급 목표'],['지호',1,''],['하윤',2,''],['도윤',1,''],['서아',0,'']];
  const students=names.map(([name,t,goal],i)=>({id:uid(),name,tid:teachers[t].id,goal,color:SPENS[i]}));
  const pl=[[0,2,'19:00','21:00'],[1,1,'16:00','18:00'],[2,3,'17:00','19:00'],[3,2,'15:00','17:30'],[4,5,'18:00','20:00'],[1,4,'19:00','21:00']];
  const plans={};
  pl.forEach(([si,dow,start,end])=>{const s=students[si];(plans[s.id]??={})[ym]??=[];plans[s.id][ym].push({dow,start,end,tid:s.tid})});
  const d={teachers,students,sessions:[],plans,sample:true};
  students.forEach(s=>applyPlan(d,s.id,ym,1));
  const first=d.sessions.filter(x=>x.sid===students[0].id).sort((a,b)=>a.date.localeCompare(b.date))[0];
  if(first)first.log={content:'맛중 HSK 4급 듣기 ~p.35',homework:'p.46 문제 풀기',hanja:true};
  return d;
}
function migrate(d){
  if(!d||!d.students||!d.sessions||(!d.teachers&&d.sample)||(d.sample&&!d.plans)||(d.sample&&!d.sessions.some(x=>x.fromPlan)))return seed();
  if(!d.teachers){const t={id:uid(),name:'원장님',color:'red'};d.teachers=[t];
    d.students.forEach(s=>{s.tid=t.id;delete s.color});d.sessions.forEach(x=>x.tid=t.id)}
  d.plans??={};
  return d;
}
/* 월별 스케줄 → 그 달 수업 생성 (일지 쓴 수업은 보존) */
function applyPlan(d,sid,ym,fromDay){
  const [y,m]=ym.split('-').map(Number),last=new Date(y,m,0).getDate();
  const from=`${ym}-${pad(fromDay)}`;
  d.sessions=d.sessions.filter(x=>!(x.sid===sid&&x.date.startsWith(ym)&&x.date>=from&&!keep(x)));
  const rows=(d.plans[sid]||{})[ym]||[];
  for(let k=fromDay;k<=last;k++){const dt=new Date(y,m-1,k);
    rows.filter(r=>r.dow===dt.getDay()).forEach(r=>{const date=ymd(dt);
      if(!d.sessions.some(x=>x.sid===sid&&x.date===date&&x.start===r.start))
        d.sessions.push({id:uid(),sid,tid:r.tid||null,date,start:r.start,end:r.end,memo:'',fromPlan:true})})}
}
/* ===== 구글 시트 연결 ===== */
const CFG_KEY='academy-config',CACHE_KEY='academy-cloud-cache',PEND_KEY='academy-pending';
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let CFG=ls.get(CFG_KEY,{});
(()=>{const q=new URLSearchParams(location.search);if(q.get('api')){CFG={api:q.get('api'),code:q.get('code')||''};ls.set(CFG_KEY,CFG);try{history.replaceState(null,'',location.pathname)}catch(e){}}})();
const cloud=()=>!!CFG.api;
let snap=new Map(),pending=ls.get(PEND_KEY,[]),sync='idle',lastOk=0,flushing=null;
function records(d){const r=[];
  d.teachers.forEach(x=>r.push(['teacher',x.id,x]));d.students.forEach(x=>r.push(['student',x.id,x]));
  d.sessions.forEach(x=>{const{_lane,...y}=x;r.push(['session',x.id,y])});
  Object.entries(d.plans||{}).forEach(([sid,p])=>Object.entries(p).forEach(([ym,rows])=>r.push(['plan',sid+'_'+ym,{sid,ym,rows}])));
  return r}
const snapOf=d=>new Map(records(d).map(([t,id,x])=>[t+'|'+id,JSON.stringify(x)]));
function fromRows(rows){const d={teachers:[],students:[],sessions:[],plans:{},sample:false};
  rows.forEach(r=>{if(r.deleted||!r.data)return;
    if(r.type==='teacher')d.teachers.push(r.data);else if(r.type==='student')d.students.push(r.data);
    else if(r.type==='session')d.sessions.push(r.data);else if(r.type==='plan')(d.plans[r.data.sid]??={})[r.data.ym]=r.data.rows});
  return d}
async function api(method,body){
  const url=CFG.api+(method==='GET'?`?code=${encodeURIComponent(CFG.code||'')}&t=${Date.now()}`:'');
  const res=await fetch(url,method==='GET'?{}:{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code:CFG.code||'',...body})});
  const j=await res.json();if(!j.ok)throw new Error(j.error||'fail');return j}
function setSync(v){sync=v;if(v==='ok')lastOk=Date.now();const el=$('#sub');if(el){el.textContent=subText();el.classList.toggle('bad',v==='error'||v==='badcode')}}
function subText(){
  if(!cloud())return `선생님 ${S.teachers.length}명 · 원생 ${S.students.length}명`;
  return {saving:'저장 중…',loading:'불러오는 중…',error:`저장 안 됨${pending.length?` (${pending.length}건 대기)`:''} · 연결 확인`,badcode:'접속 코드가 맞지 않습니다'}[sync]||'시트 연결됨 · 저장 완료'}
function queueDiff(){const cur=snapOf(S);
  cur.forEach((v,k)=>{if(snap.get(k)!==v){const i=k.indexOf('|');pending.push({type:k.slice(0,i),id:k.slice(i+1),data:JSON.parse(v)})}});
  snap.forEach((v,k)=>{if(!cur.has(k)){const i=k.indexOf('|');pending.push({type:k.slice(0,i),id:k.slice(i+1),deleted:true})}});
  snap=cur;ls.set(PEND_KEY,pending)}
function flush(){if(flushing)return flushing;if(!pending.length)return Promise.resolve();
  flushing=(async()=>{const ops=pending.slice();setSync('saving');
    try{await api('POST',{ops});pending=pending.slice(ops.length);ls.set(PEND_KEY,pending);setSync('ok')}
    catch(e){setSync(e.message==='code'?'badcode':'error')}
    flushing=null;if(pending.length&&sync==='ok')flush()})();
  return flushing}
const sheetOpen=()=>$('#sheet')?.classList.contains('open');
async function pull(force){
  if(!cloud()||(!force&&sheetOpen()))return;
  if(pending.length){await flush();if(pending.length)return}
  try{setSync('loading');const j=await api('GET');S=fromRows(j.rows);snap=snapOf(S);ls.set(CACHE_KEY,S);setSync('ok');if(!sheetOpen())render()}
  catch(e){setSync(e.message==='code'?'badcode':'error')}
}
const Store={
  load(){if(cloud()){const c=ls.get(CACHE_KEY,null);const d=c?migrate(c):{teachers:[],students:[],sessions:[],plans:{},sample:false};d.sample=false;return d}
    try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r))}catch(e){}return seed()},
  save(){
    if(cloud()){queueDiff();ls.set(CACHE_KEY,S);flush();return}
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('이 브라우저에서는 저장되지 않습니다')}}
};

/* ===== 공통 달력 ===== */
function monthGrid(cellFn){
  const y=month.getFullYear(),m=month.getMonth();
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let h=[...DOW].map((d,i)=>`<div class="dow ${i==0?'sun':i==6?'sat':''}">${d}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div class="cell empty"></div>';
  for(let d=1;d<=days;d++){const dt=new Date(y,m,d);h+=cellFn(ymd(dt),d,dt.getDay())}
  return `<div class="grid">${h}</div>`;
}
function monthBar(){
  return `<div class="monthbar"><h2>${month.getFullYear()}년 ${month.getMonth()+1}월</h2>
  <div class="arrows"><button class="iconbtn" data-act="prev" aria-label="이전 달">‹</button>
  <button class="iconbtn" data-act="thismonth" aria-label="이번 달">●</button>
  <button class="iconbtn" data-act="next" aria-label="다음 달">›</button></div></div>`;
}
const cls=(date,dow)=>`${dow==0?'sun':dow==6?'sat':''} ${date===ymd(today)?'today':''}`;

/* ===== 하루 보기 ===== */
function renderDay(){
  const byT=x=>!tFilter||sessTeacher(x)?.id===tFilter;
  const grid=monthGrid((date,d,dow)=>{
    const n=sessionsOn(date).filter(byT).filter(x=>!isAbs(x)).length;
    return `<button class="cell ${cls(date,dow)} ${date===selDate?'sel':''}" data-date="${date}" aria-label="${d}일 수업 ${n}건">
      <span class="d">${d}</span>${n?`<span class="cnt"><b>${n}</b>명</span>`:''}</button>`});
  const all=sessionsOn(selDate).filter(byT),list=all.filter(x=>!isAbs(x)),absL=all.filter(isAbs);
  const [y,m,d]=selDate.split('-').map(Number);
  const modeSeg=`<div class="seg" style="margin:0 0 10px"><button data-cmode="teacher" aria-pressed="${colorMode==='teacher'}">선생님 색</button><button data-cmode="student" aria-pressed="${colorMode==='student'}">원생 색</button></div>`;
  const legend=colorMode==='student'
    ? (()=>{const ids=[...new Set(all.map(x=>x.sid))];return ids.length?`<div class="legend">${ids.map(id=>{const st=student(id);return `<span class="chip solid" style="--c:${stuColor(st)};background:var(--c)">${esc(st.name)}</span>`}).join('')}</div>`:''})()
    : S.teachers.length?`<div class="legend"><button class="chip" data-tf="" aria-pressed="${!tFilter}" style="--c:var(--ink)">전체</button>${S.teachers.map(t=>`<button class="chip" data-tf="${t.id}" aria-pressed="${tFilter===t.id}" style="--c:${penVar(t.color)}"><span class="dot"></span>${esc(t.name)}</button>`).join('')}</div>`:'';
  let body;
  const rowH=x=>{const st=student(x.sid),t=sessTeacher(x);return `<button class="row ${isAbs(x)?'abs':''}" data-sess="${x.id}" style="--c:${colorOf(x)}">
        <span class="dot"></span><span class="t">${x.start}–${x.end}</span><span class="n">${esc(st.name)}${x.makeupOf?'<span class="badge" style="color:var(--c)">보강</span>':''} ${t?`<span class="tag">${esc(t.name)}</span>`:''}</span>
        <span class="m">${isAbs(x)?(x.makeupId?'빠짐 · 보강 잡힘':'빠짐 · 보강 필요'):hasLog(x)?'일지 ✓':'일지 쓰기'}</span></button>`};
  if(!list.length){
    body=`<div class="emptybox">${tFilter?'이 선생님은 이날 수업이 없습니다.':'이날은 잡힌 수업이 없습니다.<br>원생별 달력에서 월 스케줄을 정하거나 ‘수업 추가’를 눌러 주세요.'}</div>`+(absL.length?`<div class="list">${absL.map(rowH).join('')}</div>`:'');
  }else{
    const lanes=[];list.forEach(x=>{let i=lanes.findIndex(end=>end<=toMin(x.start));if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=toMin(x.end);x._lane=i});
    const sH=Math.min(14,Math.floor(Math.min(...list.map(x=>toMin(x.start)))/60));
    const eH=Math.max(21,Math.ceil(Math.max(...list.map(x=>toMin(x.end)))/60));
    const H=52,LW=78,total=(eH-sH)*H;
    let axis='',hr='';
    for(let h=sH;h<=eH;h++){const top=(h-sH)*H;axis+=`<div style="top:${top+8}px">${h}:00</div>`;hr+=`<div class="hr" style="top:${top+8}px"></div>`}
    const bars=list.map(x=>{const st=student(x.sid);const top=(toMin(x.start)-sH*60)/60*H+8,hh=Math.max(24,(toMin(x.end)-toMin(x.start))/60*H);
      return `<button class="bar ${colorMode==='student'?'stu':''}" data-sess="${x.id}" style="--c:${colorOf(x)};top:${top}px;height:${hh-2}px;left:${x._lane*LW+4}px;width:${LW-8}px">
        <span class="nm">${esc(st.name)}${x.makeupOf?'<span class="badge">보</span>':''}${hasLog(x)?'<span class="check-ic">✓</span>':''}</span><span class="tm">${x.start}–${x.end}</span></button>`}).join('');
    const w=`max(100%, ${lanes.length*LW+8}px)`;
    body=`<div class="tl"><div class="axis" style="height:${total+16}px">${axis}</div>
      <div class="lanes"><div class="lanes-in" style="height:${total+16}px;width:${w}">${hr}${bars}</div></div></div>
      <div class="list">${[...list,...absL].map(rowH).join('')}</div>`;
  }
  return monthBar()+grid+`<div class="dayhead"><h3><span>${m}/${d}(${DOW[new Date(y,m-1,d).getDay()]})</span> ${list.length}명</h3>
    <button class="btn" data-act="add-day">수업 추가</button></div>`+modeSeg+legend+body;
}

function renderStudent(){
  if(!S.students.length)return `<div class="emptybox" style="margin-top:18px">먼저 ‘원생 관리’에서 원생을 등록해 주세요.</div>`;
  if(!student(selStudent))selStudent=S.students[0].id;
  const st=student(selStudent),t=teacher(st.tid);
  const chips=`<div class="chips">${S.students.map(s=>`<button class="chip" data-stu="${s.id}" aria-pressed="${s.id===selStudent}" style="--c:${colorOfStu(s)}"><span class="dot"></span>${esc(s.name)}</button>`).join('')}</div>`;
  const seg=`<div class="seg"><button data-stab="cal" aria-pressed="${stuTab==='cal'}">달력</button><button data-stab="log" aria-pressed="${stuTab==='log'}">수업일지</button></div>`;
  const monthList=S.sessions.filter(x=>x.sid===selStudent&&x.date.startsWith(curYM())).sort((a,b)=>a.date.localeCompare(b.date)||toMin(a.start)-toMin(b.start));
  return chips+seg+monthBar()+(stuTab==='cal'?stuCal(st,t,monthList):stuLog(st,monthList));
}
function stuCal(st,t,monthList){
  const order={};monthList.filter(x=>!isAbs(x)).forEach((x,i)=>order[x.id]=i);
  const grid=monthGrid((date,d,dow)=>{
    const ss=monthList.filter(x=>x.date===date);
    const marks=ss.slice(0,2).map(x=>isAbs(x)?`<span class="mark abs" style="color:${colorOfSess(x)}">빠짐<br>${x.start}</span>`:`<span class="mark" style="color:${colorOfSess(x)}"><span class="n">${CIRC[order[x.id]]||order[x.id]+1}</span> ${x.start}${hasLog(x)?' ✓':''}${x.makeupOf?'<span class="badge">보</span>':''}<br>~${x.end}</span>`).join('');
    return `<button class="cell ${cls(date,dow)} ${ss.some(x=>!isAbs(x))?'has':''}" data-sdate="${date}" aria-label="${d}일${ss.length?' 수업 있음':''}">
      <span class="d">${d}</span>${marks}${ss.length>2?`<span class="more">+${ss.length-2}</span>`:''}</button>`});
  const plan=(S.plans[st.id]||{})[curYM()];
  const planTxt=plan?.length?plan.map(r=>`${DOW[r.dow]} ${r.start}~${r.end}`).join(', '):'아직 정하지 않음';
  return grid+`<p class="summary"><b>${esc(st.name)}</b>${t?` · 담당 ${esc(t.name)}`:''} · 이번 달 수업 <b>${monthList.filter(x=>!isAbs(x)).length}</b>회${monthList.some(isAbs)?` · 빠짐 ${monthList.filter(isAbs).length}회`:''}${monthList.some(x=>x.makeupOf)?` · 보강 ${monthList.filter(x=>x.makeupOf).length}회`:''}</p>
    <p class="summary">${month.getMonth()+1}월 스케줄: ${planTxt}</p>
    <button class="btn planbtn" data-act="plan">${month.getMonth()+1}월 스케줄 정하기</button>
    <p class="hint">수업 날짜를 누르면 빠짐 처리·보강 잡기·날짜 이동·수업일지 쓰기를 할 수 있습니다. 빈 날짜를 누르면 그날 한 번만 수업을 넣습니다.</p>`;
}
function stuLog(st,monthList){
  const held=monthList.filter(x=>!isAbs(x));
  const total=held.reduce((a,x)=>a+(toMin(x.end)-toMin(x.start))/60,0);
  const done=held.filter(hasLog).length;
  const goal=`<div class="goal"><p class="${st.goal?'':'none'}">${st.goal?esc(st.goal):'목표를 적어두면 일지 맨 위에 표시됩니다.'}</p><button class="linkbtn" data-act="goal">${st.goal?'수정':'목표 쓰기'}</button></div>`;
  if(!monthList.length)return goal+`<div class="emptybox">이번 달 수업이 없습니다.</div>`;
  const rows=monthList.map(x=>{const[,mm,dd]=x.date.split('-').map(Number),t=sessTeacher(x),L=x.log||{};
    if(isAbs(x))return `<tr class="abs" data-sess="${x.id}"><td class="dt">${mm}/${dd}</td><td class="tm">${x.start}<br>~${x.end}</td><td colspan="4">빠짐${x.memo?` (${esc(x.memo)})`:''}${x.makeupId&&S.sessions.find(y=>y.id===x.makeupId)?` → ${md(S.sessions.find(y=>y.id===x.makeupId).date)} 보강`:' · 보강 필요'}</td><td></td></tr>`;
    return `<tr data-sess="${x.id}"><td class="dt">${mm}/${dd}${x.makeupOf?'<span class="badge" style="color:var(--red)">보강</span>':''}</td><td class="tm">${x.start}<br>~${x.end}</td>
      <td>${L.content?esc(L.content):'<span class="todo">일지 쓰기</span>'}</td><td class="c">${hrs(x)}</td>
      <td class="c">${L.hanja?'<span class="stamp">中</span>':''}</td><td>${esc(L.homework||'')}</td>
      <td><span class="sign" style="--c:${colorOfSess(x)}">${t?esc(t.name):''}</span></td></tr>`}).join('');
  return goal+`<div class="logwrap"><table class="log"><thead><tr><th>날짜</th><th>수업시간</th><th>내용</th><th>시간</th><th>한자</th><th>숙제</th><th>선생님</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="summary">이번 달 <b>${held.length}</b>회 · 총 <b>${Number.isInteger(total)?total:total.toFixed(1)}</b>시간 · 일지 작성 <b>${done}</b>/${held.length}</p>
    <p class="hint">표를 옆으로 밀면 전체 칸이 보입니다. 줄을 누르면 일지를 쓰거나 고칠 수 있습니다.</p>`;
}

/* ===== 수업 추가·수정 + 수업일지 ===== */
let editing=null,makeupFor=null;
function openSheet({sess=null,date=selDate,sid=null,preset=null}){
  if(!S.students.length){toast('먼저 원생을 등록해 주세요');view='people';render();return}
  editing=sess;if(!preset)makeupFor=null;
  const s=sess||{sid:sid||selStudent||S.students[0].id,date,start:'19:00',end:'21:00',memo:'',...(preset||{})};
  const tid=sess?(s.tid||student(s.sid)?.tid):(s.tid||student(s.sid)?.tid);
  const L=s.log||{};
  const [,mm,dd]=s.date.split('-').map(Number);
  const mk=sess&&S.sessions.find(y=>y.id===s.makeupId),orig=sess&&S.sessions.find(y=>y.id===s.makeupOf);
  const statusBox=!sess?(makeupFor?`<div class="absbox">${md(makeupFor.date)} 빠진 수업의 <b>보강</b>을 잡습니다. 날짜와 시간을 정해 주세요.</div>`:''):isAbs(s)
    ?`<div class="absbox"><b>빠짐</b> 처리된 수업입니다.${mk?` ${md(mk.date)} ${mk.start}에 보강이 잡혀 있습니다.`:' 아직 보강이 없습니다.'}</div>

    :`${orig?`<div class="absbox">${md(orig.date)} 빠진 수업의 보강입니다.</div>`:''}<div class="statusbar"><button class="btn ghost" data-act="absent">빠짐 처리</button></div>`;
  const logBox=sess&&!isAbs(s)?`<div class="logbox"><h5>수업일지 · ${esc(student(s.sid)?.name)} ${mm}/${dd}</h5>
    <div class="field"><label for="lC">내용</label><textarea id="lC" placeholder="예: 맛중 HSK 4급 듣기 ~p.45">${esc(L.content||'')}</textarea></div>
    <div class="field"><label for="lH">숙제</label><textarea id="lH" placeholder="예: p.94~95 단어 외우기">${esc(L.homework||'')}</textarea></div>

  showSheet(`<h4 id="sheetTitle">${sess?(isAbs(s)?'빠진 수업':'수업 기록'):makeupFor?'보강 잡기':'수업 추가'}</h4>${statusBox}${logBox}
    ${sess?'<h5 class="schedh">일정</h5>':''}
    <div class="two"><div class="field"><label for="fStu">원생</label><select id="fStu">${S.students.map(x=>`<option value="${x.id}" ${x.id===s.sid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="fT">선생님</label><select id="fT">${tOptions(tid)}</select></div></div>
    <div class="field"><label for="fDate">날짜${sess?' (바꾸면 다른 날로 이동)':''}</label><input type="date" id="fDate" value="${s.date}"></div>
    <div class="two"><div class="field"><label for="fS">시작</label><input type="time" id="fS" step="300" value="${s.start}"></div>
    <div class="field"><label for="fE">끝</label><input type="time" id="fE" step="300" value="${s.end}"></div></div>
    <div class="field"><label for="fMemo">메모</label><input type="text" id="fMemo" maxlength="40" placeholder="예: 보강" value="${esc(s.memo||'')}"></div>
    <div class="err" id="fErr"></div>
    <div class="actions">${sess?'<button class="btn danger" data-act="del-sess">삭제</button>':''}
      <button class="btn ghost" data-act="close">닫기</button><button class="btn" data-act="save-sess">저장</button></div>`);
  $('#fStu').addEventListener('change',e=>{$('#fT').value=student(e.target.value)?.tid||''});
}
function saveSess(){
  const sid=$('#fStu').value,tid=$('#fT').value||null,date=$('#fDate').value,start=$('#fS').value,end=$('#fE').value,memo=$('#fMemo').value.trim();
  if(!date||!start||!end){$('#fErr').textContent='날짜와 시간을 모두 입력해 주세요.';return}
  if(toMin(end)<=toMin(start)){$('#fErr').textContent='끝 시간이 시작 시간보다 늦어야 합니다.';return}
  const st=student(sid);if(st&&!st.tid&&tid)st.tid=tid;
  if(editing){
    const log=$('#lC')?{content:$('#lC').value.trim(),homework:$('#lH').value.trim(),hanja:$('#lJ').checked}:editing.log;
    if(editing.date!==date||editing.start!==start||editing.end!==end||editing.sid!==sid)editing.fromPlan=false;
    Object.assign(editing,{sid,tid,date,start,end,memo,log});toast(hasLog(editing)?'일지를 저장했습니다':'저장했습니다');
  }else{const n={id:uid(),sid,tid,date,start,end,memo};
    if(makeupFor){n.makeupOf=makeupFor.id;makeupFor.makeupId=n.id;if(!memo)n.memo='보강'}
    S.sessions.push(n);toast(makeupFor?`${md(date)} 보강을 잡았습니다`:'저장했습니다');makeupFor=null}
  S.sample=false;Store.save();closeSheet();render();
}

function openMakeup(orig){
  makeupFor=orig;
  openSheet({date:'',sid:orig.sid,preset:{start:orig.start,end:orig.end,tid:orig.tid,memo:'보강'}});
  editing=null;
}
/* ===== 월 스케줄 정하기 ===== */
let planRows=[];
function openPlan(){
  const st=student(selStudent),ym=curYM(),p=S.plans[st.id]||{};
  const prev=new Date(month.getFullYear(),month.getMonth()-1,1),pym=`${prev.getFullYear()}-${pad(prev.getMonth()+1)}`;
  planRows=JSON.parse(JSON.stringify(p[ym]||p[pym]||[{dow:2,start:'19:00',end:'21:00',tid:st.tid}]));
  drawPlan(!p[ym]&&!!p[pym]);
}
function drawPlan(copied){
  const st=student(selStudent),isCur=curYM()===ymd(today).slice(0,7);
  const rows=planRows.map((r,i)=>`<div class="planitem"><div class="planrow">
      <select data-pi="${i}" data-pk="dow" aria-label="요일">${[...DOW].map((d,k)=>`<option value="${k}" ${k==r.dow?'selected':''}>${d}</option>`).join('')}</select>
      <input type="time" step="300" data-pi="${i}" data-pk="start" value="${r.start}" aria-label="시작">
      <input type="time" step="300" data-pi="${i}" data-pk="end" value="${r.end}" aria-label="끝">
      <button class="x" data-prm="${i}" aria-label="이 요일 빼기">×</button>
      <select class="tsel" data-pi="${i}" data-pk="tid" aria-label="선생님">${tOptions(r.tid)}</select></div></div>`).join('');
  showSheet(`<h4 id="sheetTitle">${esc(st.name)} · ${month.getMonth()+1}월 스케줄</h4>
    ${copied?'<p class="note">지난달 스케줄을 불러왔습니다. 바뀐 부분만 고치면 됩니다.</p>':''}
    ${rows||'<p class="note">요일을 추가해 주세요.</p>'}
    <button class="btn ghost" data-act="plan-add" style="width:100%;margin-bottom:12px">요일 추가</button>
    ${isCur?`<label class="check"><input type="checkbox" id="pFromToday" checked> 오늘부터 적용 (지난 날짜는 그대로 두기)</label>`:''}
    <p class="note">적용하면 ${month.getMonth()+1}월 수업이 이 스케줄로 다시 채워집니다. 수업일지를 쓴 날, 빠짐 처리한 날, 따로 옮기거나 보강으로 넣은 수업은 그대로 남습니다.</p>
    <div class="err" id="pErr"></div>
    <div class="actions"><button class="btn ghost" data-act="close">닫기</button><button class="btn" data-act="plan-apply">${month.getMonth()+1}월에 적용</button></div>`);
}
function applyPlanUI(){
  for(const r of planRows)if(toMin(r.end)<=toMin(r.start)){$('#pErr').textContent='끝 시간이 시작 시간보다 늦어야 합니다.';return}
  const ym=curYM(),st=student(selStudent);
  (S.plans[st.id]??={})[ym]=planRows.map(r=>({...r,dow:Number(r.dow)}));
  const from=$('#pFromToday')?.checked?today.getDate():1;
  applyPlan(S,st.id,ym,from);
  S.sample=false;Store.save();closeSheet();render();toast(`${month.getMonth()+1}월 스케줄을 적용했습니다`);
}

function localHas(){const d=ls.get(KEY,null);return !!(d&&!d.sample&&!d.uploaded&&((d.sessions||[]).length||(d.students||[]).length))}
async function uploadLocal(ask){
  const L=migrate(ls.get(KEY,null));if(!L||L.sample){toast('올릴 데이터가 없습니다');return}
  if(ask!==false&&!confirm(`이 기기에 있던 원생 ${L.students.length}명, 수업 ${L.sessions.length}건을 시트로 올릴까요?`))return;
  records(L).forEach(([t,id,x])=>pending.push({type:t,id,data:x}));ls.set(PEND_KEY,pending);
  await flush();if(pending.length){toast('올리지 못했습니다. 연결을 확인해 주세요');return}
  ls.set(KEY,{...L,uploaded:true});await pull(true);toast('시트로 올렸습니다');
}
async function connect(){
  const api0=$('#cApi').value.trim(),code=$('#cCode').value.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(api0)){$('#cErr').textContent='script.google.com으로 시작하는 웹 앱 주소를 넣어 주세요.';return}
  const prev=CFG;CFG={api:api0,code};$('#cErr').textContent='연결하는 중…';
  try{const j=await api('GET');ls.set(CFG_KEY,CFG);S=fromRows(j.rows);snap=snapOf(S);ls.set(CACHE_KEY,S);setSync('ok');render();toast('시트에 연결했습니다');
    if(!j.rows.length&&localHas())uploadLocal();}
  catch(e){CFG=prev;$('#cErr').textContent=e.message==='code'?'접속 코드가 맞지 않습니다.':'연결하지 못했습니다. 주소와 배포 설정(액세스: 모든 사용자)을 확인해 주세요.'}
}

let scopeTarget=null;
document.addEventListener('change',e=>{

function applyTeacherScope(kind){
  const t0=scopeTarget;if(!t0)return closeSheet();
  if(kind!=='none'){
    const from=ymd(today),ym=from.slice(0,7);
    S.sessions.forEach(x=>{if(x.sid===t0.st.id&&(kind==='all'||x.date>=from))x.tid=t0.newT});
    Object.entries(S.plans[t0.st.id]||{}).forEach(([k,rows])=>{if(kind==='all'||k>=ym)rows.forEach(r=>r.tid=t0.newT)});
  }
  Store.save();scopeTarget=null;closeSheet();render();
  toast(kind==='none'?'앞으로 넣는 수업부터 적용됩니다':'담당 선생님을 바꿨습니다');
}
document.addEventListener('click',e=>{

  if(a==='absent'&&editing){const x=editing;x.status='absent';S.sample=false;Store.save();render();

  if(a==='connect'){connect();return}

  if(a==='disconnect'){if(pending.length&&!confirm(`아직 저장되지 않은 ${pending.length}건이 있습니다. 그래도 해제할까요?`))return;
    if(!confirm('이 기기에서 시트 연결을 해제할까요? 시트의 데이터는 지워지지 않습니다.'))return;
    CFG={};ls.del(CFG_KEY);ls.del(CACHE_KEY);ls.del(PEND_KEY);pending=[];S=Store.load();render();return}
  if(a==='share-link'){const link=`${location.origin}${location.pathname}?api=${encodeURIComponent(CFG.api)}&code=${encodeURIComponent(CFG.code||'')}`;

});
